<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atendimento | Sistema Sentinela</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="topo">

        <div>

            <h2>🧑‍⚕️ Cadastro de Paciente</h2>

            <p class="subtitulo">
                Cadastre o paciente para iniciar o fluxo hospitalar.
            </p>

        </div>

        <div class="acoes">

            <a
                href="index.html"
                class="btn btn-secundario"
            >
                Sair
            </a>

        </div>

    </div>

    <hr>

    <div class="form-grid">

        <div class="campo campo-full">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome completo"
                autocomplete="name"
            >

        </div>

        <div class="campo">

            <label for="cpf">
                CPF
            </label>

            <input
                type="text"
                id="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
            >

        </div>

        <div class="campo">

            <label for="tipo">
                Tipo de atendimento
            </label>

            <select id="tipo">

                <option value="Convenio">
                    Convênio
                </option>

                <option value="Particular">
                    Particular
                </option>

            </select>

        </div>

        <div class="campo campo-full">

            <label for="foto">
                Foto do paciente
            </label>

            <input
                type="file"
                id="foto"
                accept="image/*"
            >

        </div>

    </div>

    <button
        type="button"
        class="btn-principal"
        id="btnCadastrar"
        onclick="cadastrar()"
    >
        Cadastrar paciente
    </button>

    <div id="mensagem"></div>

</div>


<script>

const API_URL =
    "https://projeto-sentinela-1-792p.onrender.com";


/* =========================================================
   CPF
   ========================================================= */

document
    .getElementById("cpf")
    .addEventListener("input", function () {

        let valor =
            this.value
                .replace(/\D/g, "")
                .slice(0, 11);

        if (valor.length > 9) {

            valor =
                valor.replace(
                    /^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/,
                    "$1.$2.$3-$4"
                );

        } else if (valor.length > 6) {

            valor =
                valor.replace(
                    /^(\d{3})(\d{3})(\d{0,3}).*/,
                    "$1.$2.$3"
                );

        } else if (valor.length > 3) {

            valor =
                valor.replace(
                    /^(\d{3})(\d{0,3}).*/,
                    "$1.$2"
                );

        }

        this.value = valor;

    });


/* =========================================================
   CADASTRAR
   ========================================================= */

async function cadastrar() {

    const nome =
        document
            .getElementById("nome")
            .value
            .trim();

    const cpf =
        document
            .getElementById("cpf")
            .value
            .trim();

    const tipo =
        document
            .getElementById("tipo")
            .value;

    const mensagem =
        document
            .getElementById("mensagem");

    const botao =
        document
            .getElementById("btnCadastrar");


    mensagem.style.display = "none";


    if (!nome) {

        mostrarMensagem(
            "Digite o nome do paciente.",
            "erro"
        );

        document
            .getElementById("nome")
            .focus();

        return;

    }


    botao.disabled = true;

    botao.textContent =
        "⏳ Cadastrando...";


    try {

        const resposta =
            await fetch(
                `${API_URL}/atendimento`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        nome,
                        cpf,
                        tipo
                    })
                }
            );


        const texto =
            await resposta.text();

        let dados = {};

        try {

            dados =
                texto
                    ? JSON.parse(texto)
                    : {};

        } catch {

            dados = {};

        }


        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                `Erro HTTP ${resposta.status}`
            );

        }


        mostrarMensagem(
            "✅ Paciente cadastrado e enviado para a triagem.",
            "sucesso"
        );


        document
            .getElementById("nome")
            .value = "";

        document
            .getElementById("cpf")
            .value = "";

        document
            .getElementById("foto")
            .value = "";

        document
            .getElementById("nome")
            .focus();


    } catch (erro) {

        console.error(
            "Erro ao cadastrar:",
            erro
        );

        mostrarMensagem(
            "❌ " + erro.message,
            "erro"
        );

    } finally {

        botao.disabled = false;

        botao.textContent =
            "Cadastrar paciente";

    }

}


/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(
    texto,
    tipo
) {

    const mensagem =
        document
            .getElementById("mensagem");

    mensagem.textContent =
        texto;

    mensagem.className =
        tipo;

    mensagem.style.display =
        "block";

}

</script>

</body>
</html>

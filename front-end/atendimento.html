<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atendimento | Gestão Clínica</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <div class="pagina-header">

        <div>

            <h2>
                Atendimento
            </h2>

            <p class="subtitulo">
                Cadastro e recepção de pacientes
            </p>

        </div>

        <div class="icone">
            🏥
        </div>

    </div>


    <!-- =====================================================
         DESCRIÇÃO
         ===================================================== -->

    <div class="descricao">

        Preencha os dados do paciente para
        encaminhá-lo à fila de triagem.

    </div>


    <!-- =====================================================
         NOME
         ===================================================== -->

    <label
        class="campo-label"
        for="nome"
    >
        Nome do paciente
    </label>

    <input
        id="nome"
        type="text"
        placeholder="Digite o nome completo"
        autocomplete="name"
    >


    <!-- =====================================================
         CPF
         ===================================================== -->

    <label
        class="campo-label"
        for="cpf"
    >
        CPF
    </label>

    <input
        id="cpf"
        type="text"
        placeholder="Digite o CPF"
        inputmode="numeric"
        autocomplete="off"
    >


    <!-- =====================================================
         TIPO DE ATENDIMENTO
         ===================================================== -->

    <label
        class="campo-label"
        for="tipo"
    >
        Tipo de atendimento
    </label>

    <select id="tipo">

        <option value="Convenio">
            Convênio
        </option>

        <option value="Particular">
            Particular
        </option>

    </select>


    <!-- =====================================================
         DOCUMENTO / FOTO
         ===================================================== -->

    <label
        class="campo-label"
        for="foto"
    >
        Documento / Foto
    </label>

    <input
        type="file"
        id="foto"
        accept="image/*"
    >


    <!-- =====================================================
         BOTÃO
         ===================================================== -->

    <button
        type="button"
        onclick="cadastrar()"
        style="width:100%;"
    >
        Cadastrar paciente
    </button>

</div>


<script>

async function cadastrar() {

    const nome =
        document
            .getElementById("nome")
            .value
            .trim();

    const cpf =
        document
            .getElementById("cpf")
            .value
            .trim();

    const tipo =
        document
            .getElementById("tipo")
            .value;


    /* ======================================================
       VALIDAÇÃO
       ====================================================== */

    if (!nome) {

        alert(
            "Digite o nome do paciente."
        );

        document
            .getElementById("nome")
            .focus();

        return;
    }


    /* ======================================================
       ENVIO PARA O SERVIDOR
       ====================================================== */

    try {

        const response =
            await fetch(
                "/atendimento",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        nome,
                        cpf,
                        tipo

                    })

                }
            );


        const data =
            await response.json();


        /* ==================================================
           ERRO DA API
           ================================================== */

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao cadastrar paciente."
            );

        }


        /* ==================================================
           SUCESSO
           ================================================== */

        alert(
            "✅ Paciente cadastrado com sucesso!\n\n" +
            "Paciente enviado para a triagem."
        );


        /* ==================================================
           LIMPAR FORMULÁRIO
           ================================================== */

        document
            .getElementById("nome")
            .value = "";

        document
            .getElementById("cpf")
            .value = "";

        document
            .getElementById("tipo")
            .value = "Convenio";

        document
            .getElementById("foto")
            .value = "";


        document
            .getElementById("nome")
            .focus();


    } catch (error) {

        console.error(
            "Erro ao cadastrar paciente:",
            error
        );

        alert(
            "❌ " +
            (
                error.message ||
                "Não foi possível cadastrar o paciente."
            )
        );

    }

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atendimento</title>

    <!-- CSS CORRETO -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="topo">

        <div>
            <span class="icone">🧑‍💼</span>

            <h2>Atendimento</h2>

            <p>Cadastro de pacientes</p>
        </div>

        <a href="index.html" class="btn-voltar">
            Sair
        </a>

    </div>


    <!-- NOME -->
    <input
        type="text"
        id="nome"
        placeholder="Nome completo"
        autocomplete="name"
    >


    <!-- CPF -->
    <input
        type="text"
        id="cpf"
        placeholder="CPF"
        maxlength="14"
    >


    <!-- TIPO DE ATENDIMENTO -->
    <select id="tipo">

        <option value="Convenio">
            Convênio
        </option>

        <option value="Particular">
            Particular
        </option>

    </select>


    <!-- FOTO -->
    <input
        type="file"
        id="foto"
        accept="image/*"
    >


    <!-- CADASTRAR -->
    <button type="button" onclick="cadastrar()">
        Cadastrar paciente
    </button>


    <!-- MENSAGEM -->
    <div id="mensagem"></div>

</div>


<script>

async function cadastrar() {

    const nome =
        document.getElementById("nome").value.trim();

    const cpf =
        document.getElementById("cpf").value.trim();

    const tipo =
        document.getElementById("tipo").value;

    const mensagem =
        document.getElementById("mensagem");


    // Limpa mensagem anterior
    mensagem.className = "";
    mensagem.innerHTML = "";


    // Verifica nome
    if (!nome) {

        mensagem.className = "erro";

        mensagem.innerHTML =
            "❌ Digite o nome do paciente.";

        document.getElementById("nome").focus();

        return;
    }


    try {

        const resposta = await fetch(
            "/atendimento",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    nome,
                    cpf,
                    tipo
                })
            }
        );


        const dados = await resposta.json().catch(() => null);


        if (!resposta.ok) {

            throw new Error(
                dados?.erro || "Erro ao cadastrar paciente"
            );
        }


        // SUCESSO
        mensagem.className = "sucesso";

        mensagem.innerHTML =
            "✅ Paciente enviado para a triagem!";


        // Limpa os campos
        document.getElementById("nome").value = "";

        document.getElementById("cpf").value = "";

        document.getElementById("foto").value = "";


        // Volta para o primeiro campo
        document.getElementById("nome").focus();


    } catch (erro) {

        mensagem.className = "erro";

        mensagem.innerHTML =
            "❌ " + erro.message;

        console.error(
            "Erro ao cadastrar paciente:",
            erro
        );
    }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Gestão Clínica</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="login-page">

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            🏥
        </div>

        <h1>
            Sistema de Gestão Clínica
        </h1>

        <p class="subtitulo">
            Acesso ao sistema hospitalar
        </p>

        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
            autocomplete="username"
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Entrar
        </button>

        <div id="mensagem"></div>

        <div class="usuarios-teste">

            <strong>
                Usuários de teste
            </strong>

            <p>
                Atendimento:
                atendimento / 123
            </p>

            <p>
                Triagem:
                triagem / 123
            </p>

            <p>
                Médico:
                medico / 123
            </p>

        </div>

    </div>

</div>


<script>

function login() {

    const usuario =
        document
            .getElementById("usuario")
            .value
            .trim();

    const senha =
        document
            .getElementById("senha")
            .value
            .trim();

    const mensagem =
        document.getElementById("mensagem");

    mensagem.textContent = "";


    if (!usuario || !senha) {

        mensagem.textContent =
            "Informe usuário e senha.";

        return;
    }


    fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            usuario,
            senha

        })

    })

    .then(async response => {

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Usuário ou senha inválidos."
            );

        }

        return data;

    })

    .then(data => {

        const tipo =
            data.usuario &&
            data.usuario.tipo;


        if (tipo === "triagem") {

            window.location.href =
                "triagem.html";

        }

        else if (tipo === "medico") {

            window.location.href =
                "medico.html";

        }

        else if (tipo === "atendimento") {

            window.location.href =
                "atendimento.html";

        }

        else {

            mensagem.textContent =
                "Tipo de usuário não reconhecido.";

        }

    })

    .catch(error => {

        console.error(error);

        mensagem.textContent =
            error.message ||
            "Não foi possível realizar o login.";

    });

}


/* ======================================================
   ENTER PARA LOGIN
   ====================================================== */

document
    .getElementById("senha")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );

</script>

</body>

</html>

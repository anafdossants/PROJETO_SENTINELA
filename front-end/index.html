<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Gestão Clínica</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-card">

            <!-- =================================================
                 LOGO
                 ================================================= -->

            <div class="logo">
                <img
                    src="img/logo.png"
                    alt="Logo do Hospital"
                >
            </div>


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <h1>
                Sistema de Gestão Clínica
            </h1>

            <p class="subtitulo">
                Acesso ao sistema hospitalar
            </p>


            <!-- =================================================
                 FORMULÁRIO
                 ================================================= -->

            <form id="loginForm">

                <!-- USUÁRIO -->

                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        id="usuario"
                        type="text"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                    >

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        id="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                    >

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="btnEntrar"
                >
                    Entrar
                </button>

            </form>


            <!-- =================================================
                 MENSAGEM
                 ================================================= -->

            <div id="mensagem"></div>

        </section>

    </main>


    <!-- =========================================================
         LOGIN
         ========================================================= -->

    <script>

        const formulario =
            document.getElementById("loginForm");

        const usuarioInput =
            document.getElementById("usuario");

        const senhaInput =
            document.getElementById("senha");

        const mensagem =
            document.getElementById("mensagem");

        const botao =
            document.getElementById("btnEntrar");


        formulario.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                login();

            }
        );


        async function login() {

            const usuario =
                usuarioInput.value.trim();

            const senha =
                senhaInput.value.trim();


            mensagem.textContent = "";


            /* ===============================================
               VALIDAÇÃO
               =============================================== */

            if (!usuario || !senha) {

                mensagem.textContent =
                    "Informe usuário e senha.";

                return;
            }


            /* ===============================================
               ESTADO DO BOTÃO
               =============================================== */

            botao.disabled = true;

            botao.textContent =
                "Entrando...";


            try {

                /* ===========================================
                   ENVIA PARA O SERVIDOR
                   =========================================== */

                const response =
                    await fetch("/login", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            usuario: usuario,

                            senha: senha

                        })

                    });


                const data =
                    await response.json();


                /* ===========================================
                   ERRO
                   =========================================== */

                if (!response.ok) {

                    throw new Error(
                        data.erro ||
                        "Usuário ou senha inválidos."
                    );

                }


                /* ===========================================
                   TIPO DE USUÁRIO
                   =========================================== */

                const tipo =
                    data.usuario &&
                    data.usuario.tipo;


                /* ===========================================
                   TRIAGEM
                   =========================================== */

                if (tipo === "triagem") {

                    window.location.href =
                        "triagem.html";

                    return;
                }


                /* ===========================================
                   MÉDICO
                   =========================================== */

                if (tipo === "medico") {

                    window.location.href =
                        "medico.html";

                    return;
                }


                /* ===========================================
                   ATENDIMENTO
                   =========================================== */

                if (tipo === "atendimento") {

                    window.location.href =
                        "atendimento.html";

                    return;
                }


                /* ===========================================
                   TIPO NÃO RECONHECIDO
                   =========================================== */

                mensagem.textContent =
                    "Tipo de usuário não reconhecido.";

            }

            catch (error) {

                console.error(error);

                mensagem.textContent =
                    error.message ||
                    "Não foi possível realizar o login.";

            }

            finally {

                botao.disabled = false;

                botao.textContent =
                    "Entrar";

            }

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Triagem Hospitalar</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <div class="topo">

        <div>

            <h2>🩺 Triagem Hospitalar</h2>

            <p class="subtitulo">
                Pacientes aguardando triagem
            </p>

        </div>

        <div class="acoes">

            <button
                class="btn-tv"
                onclick="window.open('tv.html','_blank')"
            >
                📺 Abrir TV
            </button>

            <button
                class="btn-secundario"
                onclick="location.href='index.html'"
            >
                Sair
            </button>

        </div>

    </div>

    <hr>

    <section class="fila-box">

        <div class="fila-header">

            <h3>Pacientes na fila</h3>

            <button
                class="btn-secundario"
                onclick="carregarPacientes()"
            >
                🔄 Atualizar
            </button>

        </div>

        <div id="fila">
            Carregando...
        </div>

    </section>

    <hr>

    <h3>Nova triagem</h3>

    <div
        id="pacienteSelecionado"
        class="paciente-selecionado"
    >
        Nenhum paciente selecionado.
    </div>

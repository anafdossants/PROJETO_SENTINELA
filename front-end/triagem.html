<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Triagem | Sistema Sentinela</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="topo">

        <div>

            <h2>🩺 Triagem Hospitalar</h2>

            <p class="subtitulo">
                Classificação e encaminhamento dos pacientes.
            </p>

        </div>

        <div class="acoes">

            <button
                class="btn-tv"
                type="button"
                onclick="window.open('tv.html', '_blank')"
            >
                📺 Abrir TV
            </button>

            <a
                href="index.html"
                class="btn btn-secundario"
            >
                Sair
            </a>

        </div>

    </div>


    <hr>


    <section class="fila-box">

        <div class="fila-header">

            <h3>
                Pacientes aguardando triagem
            </h3>

            <button
                class="btn-secundario"
                id="btnAtualizar"
                type="button"
                onclick="carregarPacientes()"
            >
                🔄 Atualizar
            </button>

        </div>

        <div id="fila">
            Carregando...
        </div>

    </section>


    <hr>


    <h3>
        Nova triagem
    </h3>


    <div
        id="pacienteSelecionado"
        class="paciente-selecionado"
    >
        Nenhum paciente selecionado.
    </div>


    <div class="form-triagem">

        <div class="form-grid">

            <div class="campo">

                <label>
                    Paciente
                </label>

                <input
                    id="nome"
                    readonly
                    placeholder="Selecione um paciente"
                >

            </div>


            <div class="campo">

                <label>
                    CPF
                </label>

                <input
                    id="cpf"
                    readonly
                    placeholder="CPF"
                >

            </div>


            <div class="campo">

                <label for="sintoma">
                    Sintoma principal
                </label>

                <select id="sintoma">

                    <option value="">
                        Selecione
                    </option>

                    <option value="dor">
                        Dor
                    </option>

                    <option value="febre">
                        Febre
                    </option>

                    <option value="vomito">
                        Vômito
                    </option>

                    <option value="diarreia">
                        Diarreia
                    </option>

                    <option value="falta_ar_moderada">
                        Falta de ar moderada
                    </option>

                    <option value="falta_ar_grave">
                        Falta de ar grave
                    </option>

                    <option value="infarto">
                        Infarto
                    </option>

                    <option value="avc">
                        AVC
                    </option>

                    <option value="convulsao">
                        Convulsão
                    </option>

                    <option value="hemorragia">
                        Hemorragia
                    </option>

                    <option value="outro">
                        Outro
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="temperatura">
                    Temperatura
                </label>

                <input
                    type="number"
                    id="temperatura"
                    step="0.1"
                    min="1"
                    placeholder="Ex.: 36.5"
                >

            </div>


            <div class="campo">

                <label for="alergia">
                    Alergia
                </label>

                <input
                    type="text"
                    id="alergia"
                    placeholder="Informe se houver"
                >

            </div>


            <div class="campo campo-full">

                <label for="observacao">
                    Observações
                </label>

                <textarea
                    id="observacao"
                    placeholder="Informações importantes..."
                ></textarea>

            </div>

        </div>


        <div class="risco-preview">

            O risco será definido pelo sistema de acordo
            com os dados da triagem.

        </div>


        <div style="margin-top:20px;text-align:right">

            <button
                class="btn-principal"
                id="btnSalvar"
                type="button"
                onclick="salvarTriagem()"
            >
                🩺 Salvar triagem
            </button>

        </div>


        <div id="mensagem"></div>

    </div>

</div>


<script>

const API_URL =
    "https://projeto-sentinela-1-792p.onrender.com";

let pacienteSelecionado = null;


/* =========================================================
   CARREGAR PACIENTES
   ========================================================= */

async function carregarPacientes() {

    const fila =
        document.getElementById("fila");

    const botao =
        document.getElementById("btnAtualizar");


    botao.disabled = true;

    fila.innerHTML =
        "🔄 Atualizando fila...";


    try {

        const resposta =
            await fetch(
                `${API_URL}/pacientes/triagem`,
                {
                    cache: "no-cache",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!resposta.ok) {

            throw new Error(
                `Erro HTTP ${resposta.status}`
            );

        }


        const pacientes =
            await resposta.json();


        if (!Array.isArray(pacientes)) {

            throw new Error(
                "A API retornou dados inválidos."
            );

        }


        if (!pacientes.length) {

            fila.innerHTML = `
                <div class="vazia">
                    🟢 Nenhum paciente aguardando triagem.
                </div>
            `;

            return;

        }


        fila.innerHTML = "";


        pacientes.forEach(
            paciente => {

                const card =
                    document.createElement("div");

                card.className =
                    "paciente-fila";


                const info =
                    document.createElement("div");

                info.className =
                    "paciente-info";


                const nome =
                    document.createElement("strong");

                nome.textContent =
                    paciente.nome ||
                    "Sem nome";


                const detalhes =
                    document.createElement("span");

                detalhes.textContent =
                    `CPF: ${paciente.cpf || "Não informado"} • ` +
                    `${paciente.tipo || "Particular"}`;


                info.appendChild(nome);

                info.appendChild(detalhes);


                const botao =
                    document.createElement("button");

                botao.className =
                    "btn-principal";

                botao.textContent =
                    "Selecionar";

                botao.type =
                    "button";


                botao.onclick =
                    () => selecionarPaciente(paciente);


                card.appendChild(info);

                card.appendChild(botao);

                fila.appendChild(card);

            }
        );


    } catch (erro) {

        console.error(
            erro
        );

        fila.innerHTML = `
            <div class="mensagem-erro">
                ❌ Não foi possível carregar a fila.
                <br><br>
                ${escapeHTML(erro.message)}
            </div>
        `;

    } finally {

        botao.disabled = false;

    }

}


/* =========================================================
   SELECIONAR
   ========================================================= */

function selecionarPaciente(paciente) {

    pacienteSelecionado =
        paciente;


    document.getElementById(
        "nome"
    ).value =
        paciente.nome || "";


    document.getElementById(
        "cpf"
    ).value =
        paciente.cpf || "";


    document.getElementById(
        "pacienteSelecionado"
    ).innerHTML = `

        <strong>
            Paciente selecionado:
        </strong>

        ${escapeHTML(
            paciente.nome || ""
        )}

        <br>

        <small>
            CPF:
            ${escapeHTML(
                paciente.cpf || "Não informado"
            )}

            • Tipo:
            ${escapeHTML(
                paciente.tipo || "Particular"
            )}
        </small>

    `;


    limparMensagem();

}


/* =========================================================
   SALVAR TRIAGEM
   ========================================================= */

    if (!pacienteSelecionado) {

        mostrarMensagem(

            "erro"
        );

        return;

    }

            .value
            .trim();

    const temperatura =
        document

            .value;

    const alergia =
        document
            .getElementById("alergia")
            .value
            .trim();

    const observacao =
        document
            .getElementById("observacao")
            .value
            .trim();


    if (!sintoma) {

        mostrarMensagem(

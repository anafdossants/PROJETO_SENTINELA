<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Médico</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .card-paciente {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .card-paciente h4 {
            margin-top: 0;
            font-size: 18px;
        }

        .card-paciente p {
            margin: 8px 0;
        }

        .risco {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .risco-vermelho {
            background: #fee2e2;
            color: #991b1b;
        }

        .risco-amarelo {
            background: #fef3c7;
            color: #92400e;
        }

        .risco-verde {
            background: #dcfce7;
            color: #166534;
        }

        .btn-atender {
            margin-top: 10px;
        }

        .mensagem-vazia {
            padding: 20px;
            background: #f0fdf4;
            border-radius: 10px;
            color: #166534;
            text-align: center;
        }

        .mensagem-erro {
            padding: 20px;
            background: #fef2f2;
            border-radius: 10px;
            color: #991b1b;
        }

        .paciente-selecionado {
            margin-bottom: 15px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 8px;
        }

        .carregando {
            padding: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- ================================================= -->
    <!-- CABEÇALHO -->
    <!-- ================================================= -->

    <div class="topo">

        <div>

            <h2>🩺 Painel Médico</h2>

            <p class="subtitulo">
                Pacientes aguardando consulta
            </p>

        </div>

        <button
            class="btn-secundario"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

    <hr>


    <!-- ================================================= -->
    <!-- FILA MÉDICA -->
    <!-- ================================================= -->

    <div class="fila-header">

        <h3>Fila médica</h3>

        <button
            class="btn-secundario"
            id="btnAtualizar"
            onclick="carregarTriagens()"
        >
            🔄 Atualizar
        </button>

    </div>


    <div id="triagens">

        <div class="carregando">
            🔄 Carregando pacientes...
        </div>

    </div>


    <hr>


    <!-- ================================================= -->
    <!-- CONSULTA -->
    <!-- ================================================= -->

    <h3>Consulta</h3>


    <div
        id="pacienteSelecionado"
        class="paciente-selecionado"
    >
        Nenhum paciente selecionado.
    </div>


    <input
        id="paciente"
        placeholder="Paciente"
        readonly
    >


    <input
        id="diagnostico"
        placeholder="Diagnóstico"
    >


    <select id="medicacao">

        <option value="">
            Selecione a medicação
        </option>

    </select>


    <textarea
        id="obs"
        placeholder="Observações"
    ></textarea>


    <button
        onclick="salvarConsulta()"
    >
        Finalizar consulta
    </button>

</div>


<script>

    // =====================================================
    // CONFIGURAÇÃO DA API
    // =====================================================

    /*
        ALTERE ESTA URL se sua API estiver em outro endereço.

        Exemplo local:
        http://localhost:3000

        Se seu frontend e backend estiverem
        em portas diferentes, mantenha a URL completa.
    */

    const API_URL = "http://localhost:3000";


    // =====================================================
    // VARIÁVEIS
    // =====================================================

    let pacienteAtual = null;


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            carregarTriagens();

            carregarMedicacoes();

        }
    );


    // =====================================================
    // CARREGAR TRIAGENS
    // =====================================================

    async function carregarTriagens() {

        const container =
            document.getElementById("triagens");

        const botao =
            document.getElementById("btnAtualizar");


        container.innerHTML = `
            <div class="carregando">
                🔄 Atualizando fila...
            </div>
        `;


        botao.disabled = true;


        try {

            const resposta =
                await fetch(
                    `${API_URL}/triagens`
                );


            if (!resposta.ok) {

                throw new Error(
                    `Erro HTTP ${resposta.status}`
                );

            }


            const triagens =
                await resposta.json();


            console.log(
                "Triagens recebidas:",
                triagens
            );


            /*
                Mostra somente pacientes
                aguardando o médico.
            */

            const fila =
                triagens.filter(
                    function (triagem) {

                        return (
                            triagem.status ===
                            "aguardando_medico"
                        );

                    }
                );


            // =================================================
            // NENHUM PACIENTE
            // =================================================

            if (fila.length === 0) {

                container.innerHTML = `
                    <div class="mensagem-vazia">

                        🟢 Nenhum paciente
                        aguardando consulta.

                    </div>
                `;

                return;

            }


            // =================================================
            // LIMPA A LISTA
            // =================================================

            container.innerHTML = "";


            // =================================================
            // MOSTRA OS PACIENTES
            // =================================================

            fila.forEach(
                function (triagem) {

                    const card =
                        document.createElement("div");


                    card.className =
                        "card-paciente";


                    const risco =
                        triagem.risco ||
                        "verde";


                    const classeRisco =
                        `risco-${risco}`;


                    const textoRisco =
                        risco === "vermelho"
                            ? "🔴 Risco vermelho"
                            : risco === "amarelo"
                                ? "🟡 Risco amarelo"
                                : "🟢 Risco verde";


                    card.innerHTML = `

                        <h4>
                            👤 ${escapeHTML(
                                triagem.nome ||
                                "Paciente"
                            )}
                        </h4>

                        <p>
                            <strong>Sintoma:</strong>
                            ${escapeHTML(
                                triagem.sintoma ||
                                "Não informado"
                            )}
                        </p>

                        <p>
                            <strong>Temperatura:</strong>
                            ${
                                triagem.temperatura !== null &&
                                triagem.temperatura !== undefined
                                    ? triagem.temperatura + " °C"
                                    : "Não informada"
                            }
                        </p>

                        <p>
                            <strong>Alergia:</strong>
                            ${escapeHTML(
                                triagem.alergia ||
                                "Não informado"
                            )}
                        </p>

                        <p>
                            <strong>Observação:</strong>
                            ${escapeHTML(
                                triagem.observacao ||
                                "Nenhuma"
                            )}
                        </p>

                        <p>
                            <span
                                class="risco ${classeRisco}"
                            >
                                ${textoRisco}
                            </span>
                        </p>

                        <button
                            class="btn-atender"
                            onclick="selecionarPaciente(${triagem.id})"
                        >
                            🩺 Atender paciente
                        </button>

                    `;


                    container.appendChild(card);

                }
            );

        }

        catch (erro) {

            console.error(
                "Erro ao carregar triagens:",
                erro
            );


            container.innerHTML = `

                <div class="mensagem-erro">

                    ❌ Não foi possível carregar
                    a fila médica.

                    <br><br>

                    Verifique se a API está
                    funcionando em:

                    <br>

                    <strong>
                        ${API_URL}
                    </strong>

                    <br><br>

                    Erro:
                    ${escapeHTML(erro.message)}

                </div>

            `;

        }

        finally {

            botao.disabled = false;

        }

    }


    // =====================================================
    // SELECIONAR PACIENTE
    // =====================================================

    async function selecionarPaciente(id) {

        try {

            const resposta =
                await fetch(
                    `${API_URL}/triagens`
                );


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível buscar as triagens."
                );

            }


            const triagens =
                await resposta.json();


            const paciente =
                triagens.find(
                    function (triagem) {

                        return Number(
                            triagem.id
                        ) === Number(id);

                    }
                );


            if (!paciente) {

                alert(
                    "Paciente não encontrado."
                );

                return;

            }


            pacienteAtual = paciente;


            // =================================================
            // MOSTRA PACIENTE
            // =================================================

            document.getElementById(
                "pacienteSelecionado"
            ).innerHTML = `

                🩺 <strong>
                    Paciente selecionado:
                </strong>

                ${escapeHTML(
                    paciente.nome ||
                    "Paciente"
                )}

            `;


            document.getElementById(
                "paciente"
            ).value =
                paciente.nome || "";


            // =================================================
            // LIMPA CONSULTA
            // =================================================

            document.getElementById(
                "diagnostico"
            ).value = "";


            document.getElementById(
                "medicacao"
            ).value = "";


            document.getElementById(
                "obs"
            ).value = "";


            // =================================================
            // FOCO
            // =================================================

            document.getElementById(
                "diagnostico"
            ).focus();

        }

        catch (erro) {

            console.error(
                erro
            );

            alert(
                "Erro ao selecionar paciente."
            );

        }

    }


    // =====================================================
    // CARREGAR MEDICAÇÕES
    // =====================================================

    async function carregarMedicacoes() {

        const select =
            document.getElementById(
                "medicacao"
            );


        try {

            const resposta =
                await fetch(
                    `${API_URL}/lista-medicacoes`
                );


            if (!resposta.ok) {

                throw new Error(
                    "Erro ao carregar medicações."
                );

            }


            const medicacoes =
                await resposta.json();


            /*
                Limpa opções antigas
            */

            select.innerHTML = `

                <option value="">
                    Selecione a medicação
                </option>

            `;


            medicacoes.forEach(
                function (medicacao) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        medicacao;


                    option.textContent =
                        medicacao;


                    select.appendChild(
                        option
                    );

                }
            );

        }

        catch (erro) {

            console.error(
                "Erro nas medicações:",
                erro
            );

            /*
                Não impede o médico
                de utilizar o restante
                do sistema.
            */

        }

    }


    // =====================================================
    // SALVAR CONSULTA
    // =====================================================

    async function salvarConsulta() {

        if (!pacienteAtual) {

            alert(
                "Selecione um paciente primeiro."
            );

            return;

        }


        const diagnostico =
            document
                .getElementById("diagnostico")
                .value
                .trim();


        const medicacao =
            document
                .getElementById("medicacao")
                .value;


        const obs =
            document
                .getElementById("obs")
                .value
                .trim();


        // =================================================
        // VALIDAÇÃO
        // =================================================

        if (!diagnostico) {

            alert(
                "Informe o diagnóstico."
            );

            document
                .getElementById("diagnostico")
                .focus();

            return;

        }


        try {

            const resposta =
                await fetch(
                    `${API_URL}/consulta`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            paciente:
                                pacienteAtual.nome,

                            diagnostico:
                                diagnostico,

                            medicacao:
                                medicacao,

                            obs:
                                obs

                        })

                    }
                );


            const resultado =
                await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    resultado.erro ||
                    "Erro ao salvar consulta."
                );

            }


            console.log(
                "Consulta salva:",
                resultado
            );


            alert(
                "✅ Consulta finalizada com sucesso!"
            );


            // =================================================
            // LIMPA CAMPOS
            // =================================================

            pacienteAtual = null;


            document.getElementById(
                "pacienteSelecionado"
            ).innerHTML =
                "Nenhum paciente selecionado.";


            document.getElementById(
                "paciente"
            ).value = "";


            document.getElementById(
                "diagnostico"
            ).value = "";


            document.getElementById(
                "medicacao"
            ).value = "";


            document.getElementById(
                "obs"
            ).value = "";


            // =================================================
            // ATUALIZA FILA
            // =================================================

            carregarTriagens();

        }

        catch (erro) {

            console.error(
                "Erro ao salvar consulta:",
                erro
            );


            alert(
                "❌ Não foi possível finalizar a consulta.\n\n" +
                erro.message
            );

        }

    }


    // =====================================================
    // SAIR
    // =====================================================

    function sair() {

        window.location.href =
            "index.html";

    }


    // =====================================================
    // SEGURANÇA
    // =====================================================

    function escapeHTML(valor) {

        if (
            valor === null ||
            valor === undefined
        ) {

            return "";

        }


        const div =
            document.createElement("div");


        div.textContent =
            String(valor);


        return div.innerHTML;

    }


    // =====================================================
    // ATUALIZAÇÃO AUTOMÁTICA
    // =====================================================

    /*
        Atualiza a fila automaticamente
        a cada 5 segundos.

        Assim, quando uma nova triagem
        for feita em outro computador,
        o médico verá a atualização.
    */

    setInterval(
        function () {

            carregarTriagens();

        },
        5000
    );

</script>

</body>

</html>

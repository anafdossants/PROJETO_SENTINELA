<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Médico</title>

<link rel="stylesheet" href="css/style.css">

<style>

    /* =========================================================
       CARDS DOS PACIENTES
       ========================================================= */

    .card-paciente {
        background: #ffffff;
        border: 1px solid #E5D3D3;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 15px;
        box-shadow: 0 3px 10px rgba(63, 7, 7, 0.06);
    }

    .card-paciente h4 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 18px;
        color: var(--principal);
    }

    .card-paciente p {
        margin: 8px 0;
        color: var(--texto);
    }

    /* =========================================================
       RISCO
       ========================================================= */

    .risco {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 13px;
    }

    .risco-vermelho {
        background: #fee2e2;
        color: #991b1b;
    }

    .risco-amarelo {
        background: #fef3c7;
        color: #92400e;
    }

    .risco-verde {
        background: #dcfce7;
        color: #166534;
    }

    /* =========================================================
       BOTÃO ATENDER
       ========================================================= */

    .btn-atender {
        margin-top: 10px;
        background: var(--principal);
        color: #ffffff;
    }

    .btn-atender:hover {
        background: var(--principal-hover);
    }

    /* =========================================================
       AÇÕES MÉDICAS
       ========================================================= */

    .acoes-medicas {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
    }

    .btn-acao-medica {
        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 52px;
        padding: 13px 18px;

        border-radius: 10px;

        font-family: inherit;
        font-size: 15px;
        font-weight: bold;

        text-decoration: none;

        cursor: pointer;

        transition: .2s;

        box-shadow:
            0 5px 14px rgba(63, 7, 7, .10);
    }

    /* =========================================================
       BOTÃO INTERNAÇÃO
       ========================================================= */

    .btn-internacao {
        background: #2563EB;
        color: #FFFFFF;
    }

    .btn-internacao:hover {
        background: #1D4ED8;
        color: #FFFFFF;
        transform: translateY(-2px);
    }

    /* =========================================================
       BOTÃO ALTA
       ========================================================= */

    .btn-alta {
        background: var(--verde);
        color: #FFFFFF;
    }

    .btn-alta:hover {
        background: #1C633C;
        color: #FFFFFF;
        transform: translateY(-2px);
    }

    /* =========================================================
       MENSAGENS
       ========================================================= */

    .mensagem-vazia {
        padding: 20px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 10px;
        color: #166534;
        text-align: center;
    }

    .mensagem-erro {
        padding: 20px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 10px;
        color: #991b1b;
    }

    .carregando {
        padding: 20px;
        text-align: center;
        color: var(--texto-suave);
    }

    /* =========================================================
       PACIENTE SELECIONADO
       ========================================================= */

    .paciente-selecionado {
        margin-bottom: 15px;
        padding: 14px 16px;

        background: #F8EDED;

        border-left: 5px solid var(--principal);

        border-radius: 10px;

        color: var(--texto);
    }

    .paciente-selecionado strong {
        color: var(--principal);
    }

    /* =========================================================
       BOTÕES DESABILITADOS
       ========================================================= */

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* =========================================================
       RESPONSIVIDADE
       ========================================================= */

    @media (max-width: 600px) {

        .acoes-medicas {
            grid-template-columns: 1fr;
        }

        .btn-acao-medica {
            width: 100%;
        }

    }

</style>

</head> <body> <div class="container">
<!-- =========================================================
     TOPO
     ========================================================= -->

<div class="topo">

    <div>

        <h2>
            🩺 Painel Médico
        </h2>

        <p class="subtitulo">
            Pacientes aguardando consulta
        </p>

    </div>

    <button
        class="btn-secundario"
        type="button"
        onclick="sair()"
    >
        Sair
    </button>

</div>

<hr>

<!-- =========================================================
     FILA MÉDICA
     ========================================================= -->

<div class="fila-header">

    <h3>
        Fila médica
    </h3>

    <button
        class="btn-secundario"
        id="btnAtualizar"
        type="button"
        onclick="carregarTriagens()"
    >
        🔄 Atualizar
    </button>

</div>

<div id="triagens">

    <div class="carregando">
        🔄 Carregando pacientes...
    </div>

</div>

<hr>

<!-- =========================================================
     CONSULTA
     ========================================================= -->

<h3>
    Consulta
</h3>

<div
    id="pacienteSelecionado"
    class="paciente-selecionado"
>
    Nenhum paciente selecionado.
</div>

<input
    id="paciente"
    placeholder="Paciente"
    readonly
>

<input
    id="diagnostico"
    placeholder="Diagnóstico"
>

<select id="medicacao">

    <option value="">
        Selecione a medicação
    </option>

</select>

<textarea
    id="obs"
    placeholder="Observações"
></textarea>

<button
    id="btnFinalizar"
    type="button"
    onclick="salvarConsulta()"
>
    Finalizar consulta
</button>

<!-- =========================================================
     BOTÕES DE INTERNAÇÃO E ALTA
     ========================================================= -->

<div class="acoes-medicas">

    <a
        href="internacao.html"
        class="btn-acao-medica btn-internacao"
    >
        🏥 Internação
    </a>

    <a
        href="alta.html"
        class="btn-acao-medica btn-alta"
    >
        🏠 Alta médica
    </a>

</div>

</div> <script>
// =========================================================
// CONFIGURAÇÃO DA API
// =========================================================

const API_URL =
"https://projeto-sentinela-1-792p.onrender.com";

// =========================================================
// VARIÁVEIS
// =========================================================

let pacienteAtual = null;

// =========================================================
// INICIALIZAÇÃO
// =========================================================

document.addEventListener(
"DOMContentLoaded",
function () {

    carregarTriagens();

    carregarMedicacoes();

}

);

// =========================================================
// CARREGAR FILA MÉDICA
// =========================================================

async function carregarTriagens() {

const container =
    document.getElementById("triagens");

const botao =
    document.getElementById("btnAtualizar");

container.innerHTML = `

    <div class="carregando">
        🔄 Atualizando fila...
    </div>

`;

botao.disabled = true;

try {

    const resposta =
        await fetch(
            `${API_URL}/triagens`,
            {
                method: "GET",

                headers: {
                    "Accept":
                        "application/json"
                },

                cache: "no-cache"
            }
        );

    if (!resposta.ok) {

        throw new Error(
            `Erro HTTP ${resposta.status}`
        );

    }

    const triagens =
        await resposta.json();

    if (!Array.isArray(triagens)) {

        throw new Error(
            "A API não retornou uma lista de triagens."
        );

    }

    console.log(
        "Triagens recebidas:",
        triagens
    );

    const fila =
        triagens.filter(
            function (triagem) {

                return (
                    triagem.status ===
                    "aguardando_medico"
                );

            }
        );

    if (fila.length === 0) {

        container.innerHTML = `

            <div class="mensagem-vazia">

                🟢 Nenhum paciente
                aguardando consulta.

            </div>

        `;

        return;

    }

    container.innerHTML = "";

    fila.forEach(
        function (triagem) {

            const card =
                document.createElement("div");

            card.className =
                "card-paciente";

            const risco =
                triagem.risco ||
                "verde";

            const classeRisco =
                `risco-${risco}`;

            let textoRisco;

            if (risco === "vermelho") {

                textoRisco =
                    "🔴 Risco vermelho";

            }

            else if (risco === "amarelo") {

                textoRisco =
                    "🟡 Risco amarelo";

            }

            else {

                textoRisco =
                    "🟢 Risco verde";

            }

            card.innerHTML = `

                <h4>
                    👤 ${escapeHTML(
                        triagem.nome ||
                        "Paciente"
                    )}
                </h4>

                <p>

                    <strong>
                        Sintoma:
                    </strong>

                    ${escapeHTML(
                        triagem.sintoma ||
                        "Não informado"
                    )}

                </p>

                <p>

                    <strong>
                        Temperatura:
                    </strong>

                    ${
                        triagem.temperatura !== null &&
                        triagem.temperatura !== undefined

                        ? escapeHTML(
                            triagem.temperatura
                        ) + " °C"

                        : "Não informada"
                    }

                </p>

                <p>

                    <strong>
                        Alergia:
                    </strong>

                    ${escapeHTML(
                        triagem.alergia ||
                        "Não informado"
                    )}

                </p>

                <p>

                    <strong>
                        Observação:
                    </strong>

                    ${escapeHTML(
                        triagem.observacao ||
                        "Nenhuma"
                    )}

                </p>

                <p>

                    <span
                        class="risco ${classeRisco}"
                    >
                        ${textoRisco}
                    </span>

                </p>

            `;

            const botaoAtender =
                document.createElement("button");

            botaoAtender.className =
                "btn-atender";

            botaoAtender.textContent =
                "🩺 Atender paciente";

            botaoAtender.type =
                "button";

            botaoAtender.addEventListener(
                "click",
                function () {

                    selecionarPaciente(
                        triagem
                    );

                }
            );

            card.appendChild(
                botaoAtender
            );

            container.appendChild(
                card
            );

        }
    );

}

catch (erro) {

    console.error(
        "Erro ao carregar triagens:",
        erro
    );

    container.innerHTML = `

        <div class="mensagem-erro">

            ❌ Não foi possível carregar
            a fila médica.

            <br><br>

            API:

            <br>

            <strong>
                ${escapeHTML(API_URL)}
            </strong>

            <br><br>

            Erro:

            ${escapeHTML(
                erro.message
            )}

        </div>

    `;

}

finally {

    botao.disabled = false;

}

}

// =========================================================
// SELECIONAR PACIENTE
// =========================================================

function selecionarPaciente(triagem) {

try {

    if (!triagem) {

        alert(
            "Paciente não encontrado."
        );

        return;

    }

    pacienteAtual =
        triagem;

    console.log(
        "Paciente selecionado:",
        pacienteAtual
    );

    document.getElementById(
        "pacienteSelecionado"
    ).innerHTML = `

        🩺

        <strong>
            Paciente selecionado:
        </strong>

        ${escapeHTML(
            pacienteAtual.nome ||
            "Paciente"
        )}

    `;

    document.getElementById(
        "paciente"
    ).value =
        pacienteAtual.nome || "";

    document.getElementById(
        "diagnostico"
    ).value = "";

    document.getElementById(
        "medicacao"
    ).value = "";

    document.getElementById(
        "obs"
    ).value = "";

    document.getElementById(
        "diagnostico"
    ).focus();

}

catch (erro) {

    console.error(
        "Erro ao selecionar paciente:",
        erro
    );

    alert(
        "❌ Erro ao selecionar paciente.\n\n" +
        erro.message
    );

}

}

// =========================================================
// CARREGAR MEDICAÇÕES
// =========================================================

async function carregarMedicacoes() {

const select =
    document.getElementById(
        "medicacao"
    );

try {

    const resposta =
        await fetch(
            `${API_URL}/lista-medicacoes`,
            {
                method: "GET",

                headers: {
                    "Accept":
                        "application/json"
                },

                cache: "no-cache"
            }
        );

    if (!resposta.ok) {

        throw new Error(
            `Erro HTTP ${resposta.status}`
        );

    }

    const medicacoes =
        await resposta.json();

    if (!Array.isArray(medicacoes)) {

        throw new Error(
            "Lista de medicações inválida."
        );

    }

    select.innerHTML = `

        <option value="">
            Selecione a medicação
        </option>

    `;

    medicacoes.forEach(
        function (medicacao) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                medicacao;

            option.textContent =
                medicacao;

            select.appendChild(
                option
            );

        }
    );

}

catch (erro) {

    console.error(
        "Erro nas medicações:",
        erro
    );

    select.innerHTML = `

        <option value="">
            Não foi possível carregar
            as medicações
        </option>

    `;

}

}

// =========================================================
// FINALIZAR CONSULTA
// =========================================================

async function salvarConsulta() {

if (!pacienteAtual) {

    alert(
        "Selecione um paciente primeiro."
    );

    return;

}

const diagnostico =
    document
        .getElementById("diagnostico")
        .value
        .trim();

const medicacao =
    document
        .getElementById("medicacao")
        .value;

const obs =
    document
        .getElementById("obs")
        .value
        .trim();

if (!diagnostico) {

    alert(
        "Informe o diagnóstico."
    );

    document
        .getElementById("diagnostico")
        .focus();

    return;

}

const botao =
    document.getElementById(
        "btnFinalizar"
    );

botao.disabled = true;

botao.textContent =
    "⏳ Finalizando...";

try {

    const resposta =
        await fetch(
            `${API_URL}/consulta`,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"

                },

                body: JSON.stringify({

                    pacienteId:
                        pacienteAtual.pacienteId ||
                        null,

                    triagemId:
                        pacienteAtual.id,

                    paciente:
                        pacienteAtual.nome,

                    diagnostico:
                        diagnostico,

                    medicacao:
                        medicacao,

                    obs:
                        obs

                })

            }
        );

    const texto =
        await resposta.text();

    let resultado = {};

    try {

        resultado =
            texto
                ? JSON.parse(texto)
                : {};

    }

    catch {

        resultado = {};

    }

    if (!resposta.ok) {

        throw new Error(
            resultado.erro ||
            `Erro HTTP ${resposta.status}`
        );

    }

    console.log(
        "Consulta salva:",
        resultado
    );

    alert(
        "✅ Consulta finalizada com sucesso!"
    );

    limparConsulta();

    await carregarTriagens();

}

catch (erro) {

    console.error(
        "Erro ao salvar consulta:",
        erro
    );

    alert(
        "❌ Não foi possível finalizar a consulta.\n\n" +
        erro.message
    );

}

finally {

    botao.disabled = false;

    botao.textContent =
        "Finalizar consulta";

}

}

// =========================================================
// LIMPAR CONSULTA
// =========================================================

function limparConsulta() {

pacienteAtual = null;

document.getElementById(
    "pacienteSelecionado"
).innerHTML =
    "Nenhum paciente selecionado.";

document.getElementById(
    "paciente"
).value = "";

document.getElementById(
    "diagnostico"
).value = "";

document.getElementById(
    "medicacao"
).value = "";

document.getElementById(
    "obs"
).value = "";

}

// =========================================================
// SAIR
// =========================================================

function sair() {

window.location.href =
    "index.html";

}

// =========================================================
// ESCAPAR HTML
// =========================================================

function escapeHTML(valor) {

if (
    valor === null ||
    valor === undefined
) {

    return "";

}

const div =
    document.createElement("div");

div.textContent =
    String(valor);

return div.innerHTML;

}

// =========================================================
// ATUALIZAÇÃO AUTOMÁTICA
// =========================================================

setInterval(
function () {

    carregarTriagens();

},
5000

);

</script> </body> </html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Médico</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <div class="topo">

        <div>

            <h2>🩺 Painel Médico</h2>

            <p class="subtitulo">
                Pacientes aguardando consulta
            </p>

        </div>

        <button
            class="btn-secundario"
            onclick="location.href='index.html'"
        >
            Sair
        </button>

    </div>

    <hr>

    <div class="fila-header">

        <h3>Fila médica</h3>

        <button
            class="btn-secundario"
            onclick="carregarTriagens()"
        >
            🔄 Atualizar
        </button>

    </div>

    <div id="triagens">
        Carregando...
    </div>

    <hr>

    <h3>Consulta</h3>

    <div
        id="pacienteSelecionado"
        class="paciente-selecionado"
    >
        Nenhum paciente selecionado.
    </div>

    <input
        id="paciente"
        placeholder="Paciente"
        readonly
    >

    <input
        id="diagnostico"
        placeholder="Diagnóstico"
    >

    <select id="medicacao">

        <option value="">
            Selecione a medicação
        </option>

    </select>

    <textarea
        id="obs"
        placeholder="Observações"
    ></textarea>

    <button onclick="salvarConsulta()">
        Finalizar consulta
    </button>

</div>

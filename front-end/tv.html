<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TV - Chamadas | Sistema Sentinela</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =====================================================
       CORES
    ===================================================== */

    :root {
      --principal: rgb(104, 14, 14);
      --principal-escuro: rgb(72, 8, 8);
      --principal-claro: rgb(139, 35, 35);

      --fundo: #f5f6f8;
      --branco: #ffffff;

      --texto: #241f20;
      --texto-suave: #756b6b;

      --borda: #e7dddd;

      --sombra:
        0 12px 35px rgba(0, 0, 0, 0.12);
    }


    /* =====================================================
       BODY
    ===================================================== */

    body {

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #f7f3f3 0%,
          #ffffff 50%,
          #f1eaea 100%
        );

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      color: var(--texto);

    }


    /* =====================================================
       CONTAINER PRINCIPAL
    ===================================================== */

    .tv-container {

      width: 94vw;

      height: 90vh;

      display: grid;

      grid-template-columns:
        31% 69%;

      gap: 22px;

    }


    /* =====================================================
       PAINÉIS
    ===================================================== */

    .left-panel,
    .right-panel {

      display: flex;

      flex-direction: column;

      gap: 22px;

    }


    /* =====================================================
       CARDS
    ===================================================== */

    .box {

      position: relative;

      background:
        rgba(255, 255, 255, 0.97);

      border: 1px solid var(--borda);

      border-radius: 24px;

      padding: 30px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      box-shadow: var(--sombra);

      overflow: hidden;

    }


    /* detalhe superior */

    .box::before {

      content: "";

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 7px;

      background:
        var(--principal);

    }


    /* =====================================================
       CARD DO GUICHÊ
    ===================================================== */

    .local-box {

      flex: 1;

      background:
        linear-gradient(
          145deg,
          var(--principal),
          var(--principal-escuro)
        );

      border: none;

      color: white;

    }


    .local-box::before {

      background:
        rgba(255,255,255,.8);

    }


    /* =====================================================
       TÍTULOS
    ===================================================== */

    .box-title {

      color: var(--principal);

      font-size: 2vw;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 18px;

    }


    .local-box .box-title {

      color: rgba(255,255,255,.88);

      font-size: 1.7vw;

    }


    /* =====================================================
       NÚMERO DO GUICHÊ
    ===================================================== */

    .local-number {

      color: white;

      font-size: 8vw;

      font-weight: 900;

      line-height: 1;

      text-shadow:
        0 5px 15px rgba(0,0,0,.25);

    }


    /* =====================================================
       HISTÓRICO
    ===================================================== */

    .history-box {

      flex: 1;

      justify-content: flex-start;

      align-items: stretch;

    }


    .history-box .box-title {

      text-align: center;

      width: 100%;

    }


    .history-list {

      list-style: none;

      width: 100%;

      color: var(--texto);

      font-size: 1.25vw;

      font-weight: 700;

      text-align: left;

      overflow: hidden;

    }


    .history-list li {

      padding: 13px 15px;

      margin-bottom: 8px;

      border-radius: 12px;

      background:
        #faf7f7;

      border: 1px solid #eee3e3;

      transition: .2s;

    }


    .history-list li::before {

      content: "•";

      color: var(--principal);

      font-size: 20px;

      margin-right: 8px;

    }


    /* =====================================================
       PACIENTE
    ===================================================== */

    .patient-box {

      flex: 4;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #faf5f5
        );

    }


    .patient-box .box-title {

      font-size: 2.2vw;

      margin-bottom: 30px;

    }


    .patient-name {

      width: 100%;

      color: var(--principal);

      font-size: 5.2vw;

      font-weight: 900;

      line-height: 1.15;

      word-break: break-word;

      text-transform: uppercase;

    }


    /* =====================================================
       ÍCONE DO PACIENTE
    ===================================================== */

    .patient-box::after {

      content: "🏥";

      position: absolute;

      right: 28px;

      top: 25px;

      font-size: 2.5vw;

      opacity: .12;

    }


    /* =====================================================
       LOGO / RODAPÉ
    ===================================================== */

    .logo-box {

      flex: 1;

      background:
        var(--principal);

      border: none;

      flex-direction: row;

      justify-content: center;

      gap: 15px;

    }


    .logo-box::before {

      background:
        rgba(255,255,255,.8);

    }


    .logo-icon {

      font-size: 2.5vw;

    }


    .logo-text {

      color: white;

      font-size: 2.2vw;

      font-weight: 800;

      letter-spacing: .5px;

    }


    /* =====================================================
       ANIMAÇÃO DA NOVA CHAMADA
    ===================================================== */

    @keyframes flash {

      0% {

        transform: scale(1);

        box-shadow:
          var(--sombra);

      }

      30% {

        transform: scale(1.025);

        box-shadow:
          0 0 0 8px
          rgba(104,14,14,.12),
          0 18px 45px
          rgba(104,14,14,.25);

      }

      60% {

        transform: scale(1.015);

      }

      100% {

        transform: scale(1);

        box-shadow:
          var(--sombra);

      }

    }


    .flash {

      animation:
        flash .7s ease 3;

    }


    /* =====================================================
       AGUARDANDO
    ===================================================== */

    .patient-name.waiting {

      color: var(--texto-suave);

      font-size: 3.5vw;

    }


    /* =====================================================
       RESPONSIVO
    ===================================================== */

    @media (max-width: 800px) {

      body {

        overflow-y: auto;

        align-items: flex-start;

        padding: 20px;

      }


      .tv-container {

        width: 100%;

        height: auto;

        min-height: 95vh;

        grid-template-columns: 1fr;

      }


      .left-panel,
      .right-panel {

        gap: 18px;

      }


      .local-box {

        min-height: 220px;

      }


      .local-number {

        font-size: 18vw;

      }


      .box-title {

        font-size: 5vw;

      }


      .local-box .box-title {

        font-size: 5vw;

      }


      .patient-box {

        min-height: 350px;

      }


      .patient-box .box-title {

        font-size: 5vw;

      }


      .patient-name {

        font-size: 11vw;

      }


      .patient-name.waiting {

        font-size: 8vw;

      }


      .history-list {

        font-size: 4vw;

      }


      .logo-text {

        font-size: 5vw;

      }


      .logo-icon {

        font-size: 6vw;

      }

    }

  </style>

</head>


<body>


<div class="tv-container">


  <!-- ===================================================
       PAINEL ESQUERDO
  ==================================================== -->

  <div class="left-panel">


    <!-- GUICHÊ -->

    <div class="box local-box">

      <div
        class="box-title"
        id="local-tipo"
      >
        GUICHÊ
      </div>


      <div
        class="local-number"
        id="local-numero"
      >
        --
      </div>

    </div>


    <!-- HISTÓRICO -->

    <div class="box history-box">

      <div class="box-title">
        Últimas chamadas
      </div>


      <ul
        id="history-list"
        class="history-list"
      ></ul>

    </div>

  </div>


  <!-- ===================================================
       PAINEL DIREITO
  ==================================================== -->

  <div class="right-panel">


    <!-- PACIENTE -->

    <div class="box patient-box">

      <div class="box-title">
        Paciente
      </div>


      <div
        class="patient-name waiting"
        id="patient-name"
      >
        AGUARDANDO...
      </div>

    </div>


    <!-- LOGO -->

    <div class="box logo-box">

      <div class="logo-icon">
        🏥
      </div>

      <div class="logo-text">
        Sistema Sentinela
      </div>

    </div>

  </div>

</div>


<script>

let ultimoId = null;


/* =====================================================
   ATUALIZAR TV
===================================================== */

function atualizar() {

  fetch("/tv/chamada")

    .then(response => {

      if (!response.ok) {

        throw new Error(
          "Erro ao consultar TV."
        );

      }

      return response.json();

    })

    .then(data => {

      const chamada =
        data.chamada;

      const historico =
        data.historico || [];


      /* =================================================
         CHAMADA ATUAL
      ================================================= */

      if (chamada) {

        document.getElementById(
          "local-tipo"
        ).textContent =
          chamada.localTipo ||
          "GUICHÊ";


        document.getElementById(
          "local-numero"
        ).textContent =
          chamada.localNumero ||
          "--";


        const paciente =
          document.getElementById(
            "patient-name"
          );


        paciente.textContent =
          chamada.paciente ||
          "AGUARDANDO...";


        paciente.classList.remove(
          "waiting"
        );


        /* ===============================================
           NOVA CHAMADA
        =============================================== */

        if (
          chamada.id !==
          ultimoId
        ) {

          ultimoId =
            chamada.id;


          const box =
            document.querySelector(
              ".patient-box"
            );


          box.classList.remove(
            "flash"
          );


          void box.offsetWidth;


          box.classList.add(
            "flash"
          );

        }

      } else {

        const paciente =
          document.getElementById(
            "patient-name"
          );


        paciente.textContent =
          "AGUARDANDO...";


        paciente.classList.add(
          "waiting"
        );

      }


      /* =================================================
         HISTÓRICO
      ================================================= */

      const lista =
        document.getElementById(
          "history-list"
        );


      lista.innerHTML = "";


      historico
        .slice(0, 5)
        .forEach(h => {

          const li =
            document.createElement(
              "li"
            );


          li.textContent =
            `${h.localTipo || "GUICHÊ"} ` +
            `${h.localNumero || ""} - ` +
            `${h.paciente || ""}`;


          lista.appendChild(li);

        });

    })


    .catch(error => {

      console.error(
        "Erro na TV:",
        error
      );

    });

}


/* =====================================================
   INICIAR
===================================================== */

atualizar();


/* Atualiza a cada 2 segundos */

setInterval(
  atualizar,
  2000
);

</script>


</body>

</html>
